<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="28" ry="28" fill="#1a8fd1"/>
  <!-- Graduation cap icon -->
  <g transform="translate(80,78)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap top (diamond shape) -->
    <polygon points="0,-28 42,-8 0,12 -42,-8" fill="none"/>
    <!-- Tassel string hanging down right -->
    <line x1="42" y1="-8" x2="42" y2="14"/>
    <!-- Cap brim curve (the band below the cap) -->
    <path d="M-26,0 C-26,22 26,22 26,0"/>
  </g>
</svg>
